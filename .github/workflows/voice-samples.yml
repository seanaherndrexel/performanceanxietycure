name: Narrator voice samples
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/voice-samples.yml']
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare text and script
        run: |
          sudo apt-get install -y -qq ffmpeg
          mkdir -p kdp/samples
          cat > /tmp/text.txt <<'TXT'
          Most men who deal with performance anxiety have the same question: why is this so hard to beat? It feels like the more you try to fix it, the worse it gets. You try to control your mind, push away fear, breathe a certain way, or focus on the moment. None of it helps. The problem does not start in your body. Most men who have this issue are physically fine. They can get hard alone. The body works. The real problem starts when there is a real person in front of you, and you begin to worry about what might happen.
          TXT
          cat > /tmp/save.py <<'PY'
          import subprocess, numpy as np, soundfile as sf
          def save(name, wav, sr):
              wav = np.asarray(wav, dtype=np.float32).squeeze()
              sf.write(f'/tmp/{name}.wav', wav, sr)
              subprocess.run(['ffmpeg','-loglevel','error','-y','-i',f'/tmp/{name}.wav','-af','loudnorm=I=-18:TP=-1.5','-ar','44100','-b:a','128k',f'kdp/samples/{name}.mp3'], check=True)
              print('saved', name, round(len(wav)/sr, 1), 'sec')
          PY
          cat > /tmp/pocket.py <<'PY'
          import sys, traceback; sys.path.insert(0, '/tmp')
          from save import save
          from pocket_tts import TTSModel
          text = open('/tmp/text.txt').read().strip()
          m = TTSModel.load_model()
          for v in ['bill_boerst', 'peter_yearsley', 'stuart_bell', 'george', 'michael', 'paul', 'charles']:
              try:
                  st = m.get_state_for_audio_prompt(v)
                  a = m.generate_audio(st, text)
                  save(f'pocket_{v}', a.numpy() if hasattr(a, 'numpy') else a, m.sample_rate)
              except Exception:
                  traceback.print_exc()
          PY
          cat > /tmp/kok.py <<'PY'
          import sys, traceback; sys.path.insert(0, '/tmp')
          import numpy as np
          from save import save
          from kokoro import KPipeline
          text = open('/tmp/text.txt').read().strip()
          for lang, voices in [('a', ['am_michael', 'am_adam', 'am_onyx', 'am_eric']), ('b', ['bm_george', 'bm_lewis', 'bm_daniel'])]:
              p = KPipeline(lang_code=lang)
              for v in voices:
                  try:
                      parts = [np.asarray(a) for _, _, a in p(text, voice=v, speed=0.95)]
                      save(f'kokoro_{v}', np.concatenate(parts), 24000)
                  except Exception:
                      traceback.print_exc()
          PY
      - name: Pocket TTS samples
        continue-on-error: true
        run: |
          python -m venv /tmp/vp && . /tmp/vp/bin/activate
          pip install -q --upgrade pip
          pip install -q numpy soundfile scipy
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q pocket-tts
          pip show pocket-tts | grep -E 'Name|Version|License' || true
          python /tmp/pocket.py
      - name: Kokoro samples
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq espeak-ng
          python -m venv /tmp/vk && . /tmp/vk/bin/activate
          pip install -q --upgrade pip
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q kokoro soundfile numpy
          python /tmp/kok.py
      - name: Save samples
        run: |
          rm -f kdp/samples/pocket_jean.mp3 kdp/samples/pocket_marius.mp3 kdp/samples/pocket_javert.mp3 kdp/samples/chatterbox_*.mp3
          ls -la kdp/samples
          git add -A kdp/samples
          git config user.name "pac-narrator"
          git config user.email "pac-narrator@users.noreply.github.com"
          git add kdp/samples
          git diff --cached --quiet && exit 0
          git commit -m "Add narrator voice samples"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
